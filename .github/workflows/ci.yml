name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff mypy

      # Gate 1 — Lint Check
      - name: Lint (Ruff)
        run: ruff check src/ tests/

      # Gate 2 — Type Safety
      - name: Type check (Mypy)
        run: mypy src/

      # Gate 3 — Hexagonal Core Isolation Invariant
      # The pure hex core (src/core, src/ports) MUST NOT import framework deps.
      - name: Core domain isolation check
        run: |
          ! grep -rnE 'import (fastapi|mcp|prometheus_client|redis|numpy)' src/core/ src/ports/

      # Gate 4 — Test Suite & Coverage Threshold (>= 92%)
      - name: Tests & coverage
        run: |
          pytest --cov=src --cov-report=term-missing --cov-report=xml --cov-fail-under=92

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          fail_ci_if_error: false
